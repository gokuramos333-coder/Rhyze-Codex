[build]
  publish = ".next"
  command = "npm run netlify:stage-native-bindings && npx prisma generate && NEXT_DIST_DIR=.next next build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  STORAGE_DRIVER = "netlify"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[plugins]]
  package = "./plugins/release-safety"

# Explicitly package Next.js for hosted builds as well as CLI builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"
